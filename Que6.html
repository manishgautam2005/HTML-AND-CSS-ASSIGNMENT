
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="My First Web Page - HTML & CSS course assignment">
    <title>My First Web Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 30px;
            line-height: 1.6;
        }

        main {
            max-width: 800px;
            margin: auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
        }

        h1 {
            color: #2563eb;
            text-align: center;
        }

        h2, h3, h4, h5, h6 {
            color: #0f766e;
        }

        p {
            font-size: 16px;
        }
    </style>
</head>

<body>
    <main>
        <h1>Welcome to My First Web Page</h1>

        <h2>About This Page</h2>
        <p>This page is part of my HTML &amp; CSS course.
            It uses a title and several headings.</p>

        <h3>What I am learning</h3>
        <p>HTML structure, headings, paragraphs and more.</p>

        <h4>Next steps</h4>
        <p>Links, images, forms and CSS.</p>

        <h5>Heading level 5</h5>
        <h6>Heading level 6</h6>
    </main>
</body>

</html>
